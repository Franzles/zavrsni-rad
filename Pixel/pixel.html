<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mrežna stranica sa retro estetikom</title>
    <link rel="stylesheet" href="stil_pixel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <section id="section1">
        <header><h1>Retro mrežna stranica</h1></header>
        <section id="section2">
            <img src="T_shape.png" id="T_shape">
            <div id="empty1"></div>
            <div id="empty2"></div>
            <img src="Z_shape.png" id="Z_shape">
            <div id="empty3"></div>
            <img src="L_shape.png" id="L_shape">
            <div id="empty4"></div>
            <img src="cube_shape.png" id="cube_shape">
            <div id="empty5"></div>
            <img src="I_shape.png" id="I_shape">
            <div id="empty6"></div>
        </section>
        <div id="score">
            <h2>SCORE</h2>
            <div class="edge">
                <p>10000</p>
            </div>
        </div>
        <div id="level">
            <h2>LEVEL</h2>
            <div class="edge">
                <p>6</p>
            </div>
        </div>
        <figure>
            <figcaption>Wow, this web page is so retro!</figcaption>
            <img src="cool_guy.png">
        </figure>
    </section>
</body>
